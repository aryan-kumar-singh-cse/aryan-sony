<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SonyLiv Live Sports | Aryan Streams</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hls.js for adaptive live playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 44, 85, 0.15), transparent 30rem),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 30rem),
                #070a14;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .glass-nav {
            background: rgba(11, 15, 29, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .match-card {
            background: rgba(18, 26, 52, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 44, 85, 0.45);
            box-shadow: 0 20px 45px rgba(255, 44, 85, 0.18);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #070a14; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff2c55; }

        body.modal-open { overflow: hidden; }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="min-h-screen pb-12">
        <!-- Navigation Bar -->
        <nav class="glass-nav sticky top-0 z-40 w-full">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 py-4 flex justify-between items-center gap-4 flex-wrap">
                <div class="flex items-center gap-3">
                    <div class="grid place-items-center w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-amber-500 shadow-lg shadow-rose-950/40">
                        <i class="fa-solid fa-play text-white text-base"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black tracking-wide text-white uppercase">
                            Aryan <span class="bg-gradient-to-r from-rose-500 to-amber-400 bg-clip-text text-transparent">SonyLiv Hub</span>
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">Auto-Updating Sony Sports & Live Events</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 text-xs font-bold text-slate-200 bg-slate-900/80 px-3.5 py-2 rounded-xl border border-slate-700/60 shadow-inner">
                        <span class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                        <span id="live-count">0</span> LIVE MATCHES
                    </div>
                    <button onclick="loadData()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition flex items-center gap-1.5 border border-slate-700">
                        <i class="fa-solid fa-rotate"></i> Refresh
                    </button>
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-7xl px-4 sm:px-6 mt-6 sm:mt-8">
            <!-- Search & Filters -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 sm:mb-8">
                <div id="filters" class="flex flex-wrap gap-2">
                    <button class="filter-btn bg-rose-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-lg shadow-rose-950/30">ALL</button>
                </div>
                <div class="w-full md:w-72 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Search team, match or event..." oninput="onSearch(this.value)"
                           class="w-full bg-slate-900/90 border border-slate-700/70 text-slate-200 text-xs rounded-xl pl-9 pr-4 py-2.5 outline-none focus:border-rose-500 transition">
                </div>
            </div>

            <!-- Loader -->
            <div id="loader" class="flex flex-col items-center justify-center py-28">
                <div class="w-12 h-12 border-4 border-slate-800 border-t-rose-500 rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 text-sm font-medium tracking-wide">Syncing SonyLiv live matches...</p>
            </div>

            <!-- Live Matches Section -->
            <div id="live-section" class="mb-12 hidden">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2.5">
                        <span class="w-3 h-3 bg-rose-500 rounded-full animate-pulse"></span>
                        Live Now
                    </h2>
                    <span class="text-xs text-rose-400 font-bold tracking-wider uppercase">Real-Time Streams</span>
                </div>
                <div id="live-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
            </div>

            <!-- Upcoming Matches Section -->
            <div id="upcoming-section" class="hidden">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-xl sm:text-2xl font-black text-slate-300 flex items-center gap-2.5">
                        <span class="w-3 h-3 bg-slate-600 rounded-full"></span>
                        Upcoming Events
                    </h2>
                    <span class="text-xs text-slate-400 font-bold uppercase">Scheduled</span>
                </div>
                <div id="upcoming-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
            </div>
        </main>

        <!-- Video Player Modal -->
        <div id="player-modal" class="fixed inset-0 bg-black/95 hidden z-50 flex-col items-center justify-center p-3 sm:p-6 backdrop-blur-md">
            <div class="w-full max-w-5xl flex flex-col gap-3">
                <!-- Top Player Header -->
                <div class="flex items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/90 px-4 py-3">
                    <div class="min-w-0 flex items-center gap-3">
                        <span class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                        <div class="min-w-0">
                            <h3 id="modal-title" class="text-sm sm:text-base font-bold text-white truncate">Match Player</h3>
                            <p id="modal-sub" class="text-[11px] text-slate-400 truncate">SonyLiv Official Stream</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btn-share" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition flex items-center gap-1.5 border border-slate-700">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white transition grid place-items-center text-sm font-bold">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- Video Frame -->
                <div class="player-wrapper">
                    <video id="video-element" controls autoplay playsinline></video>
                    <div id="player-error" class="absolute inset-0 bg-black/90 hidden flex-col items-center justify-center p-6 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-3xl mb-3"></i>
                        <p class="text-white text-sm font-bold mb-1">Playback Failed</p>
                        <p id="error-details" class="text-slate-400 text-xs mb-4">Stream token may have refreshed.</p>
                        <button onclick="retryPlayback()" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-xl text-xs font-bold transition">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Try Fallback Proxy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_FEED = "https://raw.githubusercontent.com/drmlive/sliv-live-events/main/sonyliv.json";
        const LOCAL_API = "/api/events";

        let allMatches = [];
        let currentFilter = "ALL";
        let searchQuery = "";
        let hlsInstance = null;
        let currentStreamUrl = "";
        let isUsingProxy = false;

        const FALLBACK_IMG = "https://origin-staticv2.sonyliv.com/videoasset_images/manage_file/1000024191/1789810486957132_ASIAN_GAME_2026_GOB_Landscape_Thumb.jpg";

        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function loadData() {
            document.getElementById("loader").style.display = "flex";
            let data = null;

            // Try local express API first, then direct GitHub feed
            try {
                const res = await fetch(LOCAL_API, { cache: "no-store" });
                if (res.ok) data = await res.json();
            } catch(e) {}

            if (!data) {
                try {
                    const res = await fetch(API_FEED, { cache: "no-store" });
                    if (res.ok) data = await res.json();
                } catch(e) {}
            }

            document.getElementById("loader").style.display = "none";

            if (!data || !data.matches) {
                document.getElementById("loader").innerHTML = '<p class="text-rose-500 font-bold">Failed to load SonyLiv matches. Click refresh to retry.</p>';
                return;
            }

            allMatches = data.matches || [];
            const liveCount = allMatches.filter(m => m.isLive).length;
            document.getElementById("live-count").textContent = liveCount;

            buildCategoryFilters(allMatches);
            renderMatches();
            checkDeepLink();
        }

        function buildCategoryFilters(matches) {
            const categories = ["ALL", ...new Set(matches.map(m => (m.event_category || "Other").trim()).filter(Boolean))];
            const c = document.getElementById("filters");
            c.innerHTML = categories.map(cat => `
                <button class="filter-btn ${cat === currentFilter ? 'bg-rose-600 text-white shadow-lg shadow-rose-950/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60'} px-4 py-1.5 rounded-full text-xs font-bold transition"
                        data-filter="${esc(cat)}" onclick="setFilter('${esc(cat)}')">${esc(cat.toUpperCase())}</button>
            `).join("");
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll(".filter-btn").forEach(b => {
                const active = b.dataset.filter === cat;
                b.className = `filter-btn ${active ? 'bg-rose-600 text-white shadow-lg shadow-rose-950/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60'} px-4 py-1.5 rounded-full text-xs font-bold transition`;
            });
            renderMatches();
        }

        function onSearch(val) {
            searchQuery = (val || "").trim().toLowerCase();
            renderMatches();
        }

        function renderCard(m) {
            const isLive = m.isLive === true;
            const img = m.src || FALLBACK_IMG;
            const title = m.match_name || m.event_name || 'SonyLiv Live Event';
            const category = m.event_category || 'Sports';
            const channel = m.broadcast_channel || 'SonyLiv';
            const lang = m.audioLanguageName || 'ENG';
            const streamUrl = m.video_url || m.pub_url || m.dai_url || '';

            const badge = isLive 
                ? '<span class="inline-flex items-center gap-1.5 text-[10px] font-black text-white bg-rose-600 px-2.5 py-0.5 rounded-full shadow"><span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>LIVE</span>'
                : '<span class="inline-flex items-center text-[10px] font-bold text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded-full border border-slate-700">UPCOMING</span>';

            const playBtn = isLive && streamUrl
                ? `<button class="w-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-rose-950/30 flex items-center justify-center gap-1.5" onclick="playMatch(${JSON.stringify(m).replace(/"/g, '&quot;')})">
                    <i class="fa-solid fa-play text-[10px]"></i> WATCH LIVE
                   </button>`
                : `<button class="w-full bg-slate-800/60 text-slate-500 py-2 rounded-xl text-xs font-bold cursor-not-allowed border border-slate-800" disabled>⏳ Scheduled</button>`;

            return `
                <div class="match-card rounded-2xl overflow-hidden shadow-xl flex flex-col">
                    <div class="relative aspect-[16/9] overflow-hidden bg-slate-950">
                        <img class="w-full h-full object-cover transition duration-300 hover:scale-105" src="${esc(img)}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'" alt="">
                        <div class="absolute top-3 left-3">${badge}</div>
                        <div class="absolute top-3 right-3 text-[10px] font-bold bg-black/70 text-slate-300 backdrop-blur-md px-2 py-0.5 rounded-lg border border-white/10">${esc(lang)}</div>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between gap-4">
                        <div>
                            <span class="text-[10px] font-bold text-amber-400 tracking-wider uppercase">${esc(category)}</span>
                            <h3 class="text-sm font-bold text-white line-clamp-2 mt-1 mb-1 leading-snug">${esc(title)}</h3>
                            <p class="text-[11px] text-slate-400 truncate"><i class="fa-solid fa-tv mr-1 text-slate-500"></i> ${esc(channel)}</p>
                        </div>
                        <div>
                            ${playBtn}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMatches() {
            let filtered = currentFilter === "ALL" 
                ? allMatches 
                : allMatches.filter(m => (m.event_category || "").trim().toUpperCase() === currentFilter.toUpperCase());

            if (searchQuery) {
                filtered = filtered.filter(m => 
                    (m.match_name || "").toLowerCase().includes(searchQuery) ||
                    (m.event_name || "").toLowerCase().includes(searchQuery) ||
                    (m.broadcast_channel || "").toLowerCase().includes(searchQuery) ||
                    (m.event_category || "").toLowerCase().includes(searchQuery)
                );
            }

            const liveMatches = filtered.filter(m => m.isLive);
            const upcomingMatches = filtered.filter(m => !m.isLive);

            const liveSection = document.getElementById("live-section");
            const upcomingSection = document.getElementById("upcoming-section");

            if (liveMatches.length > 0) {
                liveSection.classList.remove("hidden");
                document.getElementById("live-grid").innerHTML = liveMatches.map(renderCard).join("");
            } else {
                liveSection.classList.add("hidden");
            }

            if (upcomingMatches.length > 0) {
                upcomingSection.classList.remove("hidden");
                document.getElementById("upcoming-grid").innerHTML = upcomingMatches.map(renderCard).join("");
            } else {
                upcomingSection.classList.add("hidden");
            }
        }

        /* ── Player Logic ─────────────────────────────────────────────────── */
        function playMatch(m) {
            const modal = document.getElementById("player-modal");
            const title = document.getElementById("modal-title");
            const sub = document.getElementById("modal-sub");
            const errDiv = document.getElementById("player-error");

            title.textContent = m.match_name || m.event_name || 'Live Match';
            sub.textContent = `${m.broadcast_channel || 'SonyLiv'} • ${m.audioLanguageName || 'ENG'} • ${m.event_category || 'Sports'}`;
            errDiv.classList.add("hidden");

            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.body.classList.add("modal-open");

            currentStreamUrl = m.video_url || m.pub_url || m.dai_url || '';
            isUsingProxy = false;

            // Setup share button
            document.getElementById("btn-share").onclick = () => {
                const shareUrl = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(m.contentId || '')}`;
                navigator.clipboard.writeText(shareUrl).then(() => {
                    const btn = document.getElementById("btn-share");
                    const orig = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copied!`;
                    setTimeout(() => btn.innerHTML = orig, 2000);
                });
            };

            launchHls(currentStreamUrl);
        }

        function launchHls(url) {
            const video = document.getElementById("video-element");
            const errDiv = document.getElementById("player-error");

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 60
                });

                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn("HLS Fatal Error:", data.type, data.details);
                        if (!isUsingProxy) {
                            // Automatically try local streaming proxy
                            isUsingProxy = true;
                            const proxiedUrl = `/api/proxy?url=${encodeURIComponent(currentStreamUrl)}`;
                            console.log("Switching to proxy stream:", proxiedUrl);
                            launchHls(proxiedUrl);
                        } else {
                            errDiv.classList.remove("hidden");
                        }
                    }
                });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.addEventListener("loadedmetadata", () => video.play());
            }
        }

        function retryPlayback() {
            document.getElementById("player-error").classList.add("hidden");
            const proxiedUrl = `/api/proxy?url=${encodeURIComponent(currentStreamUrl)}`;
            launchHls(proxiedUrl);
        }

        function closeModal() {
            const modal = document.getElementById("player-modal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            document.body.classList.remove("modal-open");

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            const video = document.getElementById("video-element");
            video.src = "";
        }

        function checkDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (id && allMatches.length) {
                const match = allMatches.find(m => String(m.contentId).toLowerCase() === id.toLowerCase());
                if (match && match.isLive) {
                    playMatch(match);
                }
            }
        }

        // Initialize & auto-refresh every 60s
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
