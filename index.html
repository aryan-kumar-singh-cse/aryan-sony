<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>SonyLiv Live Sports | Aryan Streams</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 44, 85, 0.15), transparent 30rem),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 30rem),
                #070a14;
            color: #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .glass-nav {
            background: rgba(11, 15, 29, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .match-card {
            background: rgba(18, 26, 52, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .match-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 44, 85, 0.45);
            box-shadow: 0 20px 45px rgba(255, 44, 85, 0.18);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #070a14; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff2c55; }

        body.modal-open { overflow: hidden; }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            outline: none;
            border: none;
        }
    </style>
</head>
<body>
    <div class="min-h-screen pb-12">
        <!-- Navigation Bar -->
        <nav class="glass-nav sticky top-0 z-40 w-full">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 py-4 flex justify-between items-center gap-4 flex-wrap">
                <div class="flex items-center gap-3">
                    <div class="grid place-items-center w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-amber-500 shadow-lg shadow-rose-950/40">
                        <i class="fa-solid fa-play text-white text-base"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black tracking-wide text-white uppercase">
                            Aryan <span class="bg-gradient-to-r from-rose-500 to-amber-400 bg-clip-text text-transparent">SonyLiv Hub</span>
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">Auto-Updating Live Sports Hub</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 text-xs font-bold text-slate-200 bg-slate-900/80 px-3.5 py-2 rounded-xl border border-slate-700/60 shadow-inner">
                        <span class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                        <span id="live-count">0</span> LIVE
                    </div>
                    <button onclick="loadData(true)" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition flex items-center gap-1.5 border border-slate-700">
                        <i class="fa-solid fa-rotate"></i> Refresh
                    </button>
                    <a href="https://t.me/aryanstreams" target="_blank" rel="noreferrer" class="px-3 py-2 rounded-xl bg-[#2AABEE]/20 hover:bg-[#2AABEE]/30 text-[#2AABEE] text-xs font-bold transition flex items-center gap-1.5 border border-[#2AABEE]/30">
                        <i class="fa-brands fa-telegram"></i> Telegram
                    </a>
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-7xl px-4 sm:px-6 mt-6 sm:mt-8">
            <!-- Search & Filters -->
            <div class="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center mb-6">
                <!-- Category Tabs -->
                <div id="filters" class="flex flex-wrap gap-2">
                    <button class="filter-btn bg-rose-600 text-white shadow-lg shadow-rose-950/30 px-4 py-1.5 rounded-full text-xs font-bold transition">ALL</button>
                </div>

                <!-- Search Input -->
                <div class="relative min-w-[240px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Search match, tournament, team..." 
                           class="w-full bg-slate-900/80 border border-slate-700/70 rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-rose-500 transition"
                           oninput="onSearch(this.value)">
                </div>
            </div>

            <!-- Loader -->
            <div id="loader" class="flex flex-col items-center justify-center py-24">
                <div class="w-12 h-12 border-4 border-slate-700 border-t-rose-500 rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 text-sm font-medium tracking-wide">Syncing SonyLiv live matches...</p>
            </div>

            <!-- Live Matches Grid -->
            <div id="live-section" class="mb-10 hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-black text-white flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                        Live Matches
                    </h2>
                </div>
                <div id="live-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
            </div>

            <!-- Upcoming Matches Grid -->
            <div id="upcoming-section" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-black text-slate-300 flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 bg-slate-500 rounded-full"></span>
                        Upcoming Schedule
                    </h2>
                </div>
                <div id="upcoming-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
            </div>
        </main>

        <!-- Player Modal -->
        <div id="player-modal" class="fixed inset-0 bg-black/95 hidden z-50 flex-col items-center justify-center p-2 sm:p-5 backdrop-blur-md">
            <div class="w-full max-w-5xl relative flex flex-col gap-3">
                <div class="flex items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-950/80 px-3 sm:px-4 py-3">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="inline-flex items-center gap-1.5 text-white font-bold text-xs bg-rose-600 px-2 py-0.5 rounded">
                                <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>LIVE
                            </span>
                            <span id="modal-sub" class="text-xs text-slate-400 truncate"></span>
                        </div>
                        <h2 id="modal-title" class="mt-1 text-base sm:text-lg font-semibold text-slate-100 truncate"></h2>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <button type="button" id="btn-share" class="border border-indigo-700 hover:border-indigo-500 text-indigo-400 hover:text-indigo-200 rounded-lg px-3 py-1.5 transition-all flex items-center gap-1.5 font-medium text-xs bg-indigo-950/40">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                        <a id="btn-fullscreen-page" href="#" target="_blank" class="border border-slate-700 hover:border-rose-500 text-slate-300 hover:text-rose-400 rounded-lg px-3 py-1.5 transition-all flex items-center gap-1.5 font-medium text-xs bg-slate-900/60">
                            <i class="fa-solid fa-up-right-from-square"></i> Fullpage
                        </a>
                        <button type="button" onclick="closeModal()" class="border border-slate-700 hover:border-white hover:text-white text-slate-300 rounded-lg px-3 py-1.5 transition-all flex items-center gap-1.5 font-medium text-xs bg-slate-900/60">
                            <i class="fa-solid fa-xmark"></i> Close
                        </button>
                    </div>
                </div>

                <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 relative" style="aspect-ratio: 16 / 9;">
                    <video id="video-element" controls autoplay playsinline referrerpolicy="no-referrer"></video>
                    <div id="player-error" class="hidden absolute inset-0 items-center justify-center bg-black/90 text-center px-6 flex-col gap-3">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-3xl"></i>
                        <p class="text-slate-200 text-sm font-semibold">Stream buffering or stream token expired.</p>
                        <button onclick="retryPlayback()" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Retry Stream
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FALLBACK_IMG = "https://origin-staticv2.sonyliv.com/videoasset_images/manage_file/1000023561/1788637773558485_UNL26_Georgia_vs_Northern_Ireland_live_landscape_thumb.jpg";
        const FEEDS = [
            "https://raw.githubusercontent.com/drmlive/sliv-live-events/main/sonyliv.json",
            "https://cdn.jsdelivr.net/gh/drmlive/sliv-live-events@main/sonyliv.json",
            "https://fastly.jsdelivr.net/gh/drmlive/sliv-live-events@main/sonyliv.json"
        ];

        let allMatches = [];
        let currentFilter = "ALL";
        let searchQuery = "";
        let hlsInstance = null;
        let currentStreamUrl = "";
        let currentContentId = "";

        function esc(s) {
            return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        async function fetchLiveFeed() {
            // Check session cache (45s TTL)
            try {
                const cached = sessionStorage.getItem("sonyliv_cache");
                const cachedTime = sessionStorage.getItem("sonyliv_time");
                if (cached && cachedTime && (Date.now() - Number(cachedTime) < 45000)) {
                    return JSON.parse(cached);
                }
            } catch (_) {}

            for (const feedUrl of FEEDS) {
                try {
                    const res = await fetch(feedUrl, { cache: "no-store", referrerPolicy: "no-referrer" });
                    if (res.ok) {
                        const json = await res.json();
                        if (json && (json.matches || Array.isArray(json))) {
                            try {
                                sessionStorage.setItem("sonyliv_cache", JSON.stringify(json));
                                sessionStorage.setItem("sonyliv_time", String(Date.now()));
                            } catch (_) {}
                            return json;
                        }
                    }
                } catch (_) {}
            }
            return null;
        }

        async function loadData(force = false) {
            if (force) {
                sessionStorage.removeItem("sonyliv_cache");
                sessionStorage.removeItem("sonyliv_time");
            }
            document.getElementById("loader").style.display = "flex";
            const data = await fetchLiveFeed();
            document.getElementById("loader").style.display = "none";

            if (!data) {
                document.getElementById("loader").style.display = "flex";
                document.getElementById("loader").innerHTML = '<p class="text-rose-500 font-bold">Failed to load matches. Click refresh to retry.</p>';
                return;
            }

            allMatches = data.matches || (Array.isArray(data) ? data : []);
            const liveCount = allMatches.filter(m => m.isLive).length;
            document.getElementById("live-count").textContent = liveCount;

            buildCategoryFilters(allMatches);
            renderMatches();
            checkDeepLink();
        }

        function buildCategoryFilters(matches) {
            const categories = ["ALL", ...new Set(matches.map(m => (m.event_category || "Other").trim()).filter(Boolean))];
            const c = document.getElementById("filters");
            c.innerHTML = categories.map(cat => `
                <button class="filter-btn ${cat === currentFilter ? 'bg-rose-600 text-white shadow-lg shadow-rose-950/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60'} px-4 py-1.5 rounded-full text-xs font-bold transition"
                        data-filter="${esc(cat)}" onclick="setFilter('${esc(cat)}')">${esc(cat.toUpperCase())}</button>
            `).join("");
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll(".filter-btn").forEach(b => {
                const active = b.dataset.filter === cat;
                b.className = `filter-btn ${active ? 'bg-rose-600 text-white shadow-lg shadow-rose-950/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60'} px-4 py-1.5 rounded-full text-xs font-bold transition`;
            });
            renderMatches();
        }

        function onSearch(val) {
            searchQuery = (val || "").trim().toLowerCase();
            renderMatches();
        }

        function renderCard(m) {
            const isLive = m.isLive === true;
            const img = m.src || FALLBACK_IMG;
            const title = m.match_name || m.event_name || 'SonyLiv Live Event';
            const category = m.event_category || 'Sports';
            const channel = m.broadcast_channel || 'SonyLiv';
            const lang = m.audioLanguageName || 'ENG';
            const streamUrl = m.video_url || m.pub_url || m.dai_url || '';
            const matchJsonStr = esc(JSON.stringify(m));

            const badge = isLive 
                ? '<span class="inline-flex items-center gap-1.5 text-[10px] font-black text-white bg-rose-600 px-2.5 py-0.5 rounded-full shadow"><span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>LIVE</span>'
                : '<span class="inline-flex items-center text-[10px] font-bold text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded-full border border-slate-700">UPCOMING</span>';

            const playBtn = isLive && streamUrl
                ? `<div class="grid grid-cols-2 gap-2 mt-2">
                    <button class="bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow" onclick="playMatch(${JSON.stringify(m).replace(/"/g, '&quot;')})">
                        <i class="fa-solid fa-play text-[10px]"></i> Play
                    </button>
                    <a href="player.html?id=${encodeURIComponent(m.contentId || '')}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border border-slate-700">
                        <i class="fa-solid fa-expand text-[10px]"></i> Player
                    </a>
                   </div>`
                : `<button class="w-full bg-slate-800/50 text-slate-500 py-2 rounded-xl text-xs font-bold cursor-not-allowed border border-slate-800 mt-2" disabled>⏳ Scheduled</button>`;

            return `
                <div class="match-card rounded-2xl overflow-hidden shadow-xl flex flex-col">
                    <div class="relative aspect-[16/9] overflow-hidden bg-slate-950">
                        <img class="w-full h-full object-cover transition duration-300 hover:scale-105" src="${esc(img)}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'" alt="">
                        <div class="absolute top-3 left-3">${badge}</div>
                        <div class="absolute top-3 right-3 text-[10px] font-bold bg-black/70 text-slate-300 backdrop-blur-md px-2 py-0.5 rounded-lg border border-white/10">${esc(lang)}</div>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-amber-400 tracking-wider uppercase">${esc(category)}</span>
                            <h3 class="text-sm font-bold text-white line-clamp-2 mt-1 mb-1 leading-snug">${esc(title)}</h3>
                            <p class="text-[11px] text-slate-400 truncate"><i class="fa-solid fa-tv mr-1 text-slate-500"></i> ${esc(channel)}</p>
                        </div>
                        ${playBtn}
                    </div>
                </div>
            `;
        }

        function renderMatches() {
            let filtered = currentFilter === "ALL" 
                ? allMatches 
                : allMatches.filter(m => (m.event_category || "").trim().toUpperCase() === currentFilter.toUpperCase());

            if (searchQuery) {
                filtered = filtered.filter(m => 
                    (m.match_name || "").toLowerCase().includes(searchQuery) ||
                    (m.event_name || "").toLowerCase().includes(searchQuery) ||
                    (m.broadcast_channel || "").toLowerCase().includes(searchQuery) ||
                    (m.event_category || "").toLowerCase().includes(searchQuery)
                );
            }

            const liveMatches = filtered.filter(m => m.isLive);
            const upcomingMatches = filtered.filter(m => !m.isLive);

            const liveSection = document.getElementById("live-section");
            const upcomingSection = document.getElementById("upcoming-section");

            if (liveMatches.length > 0) {
                liveSection.classList.remove("hidden");
                document.getElementById("live-grid").innerHTML = liveMatches.map(renderCard).join("");
            } else {
                liveSection.classList.add("hidden");
            }

            if (upcomingMatches.length > 0) {
                upcomingSection.classList.remove("hidden");
                document.getElementById("upcoming-grid").innerHTML = upcomingMatches.map(renderCard).join("");
            } else {
                upcomingSection.classList.add("hidden");
            }
        }

        /* ── Player Logic ─────────────────────────────────────────────────── */
        function playMatch(m) {
            const modal = document.getElementById("player-modal");
            const title = document.getElementById("modal-title");
            const sub = document.getElementById("modal-sub");
            const errDiv = document.getElementById("player-error");

            title.textContent = m.match_name || m.event_name || 'Live Match';
            sub.textContent = `${m.broadcast_channel || 'SonyLiv'} • ${m.audioLanguageName || 'ENG'} • ${m.event_category || 'Sports'}`;
            errDiv.classList.add("hidden");

            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.body.classList.add("modal-open");

            currentStreamUrl = m.video_url || m.pub_url || m.dai_url || '';
            currentContentId = m.contentId || '';

            // Setup share button
            document.getElementById("btn-share").onclick = () => {
                const shareUrl = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(currentContentId)}`;
                navigator.clipboard.writeText(shareUrl).then(() => {
                    const btn = document.getElementById("btn-share");
                    const orig = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copied!`;
                    setTimeout(() => btn.innerHTML = orig, 2000);
                });
            };

            // Setup fullpage player link
            document.getElementById("btn-fullscreen-page").href = `player.html?id=${encodeURIComponent(currentContentId)}`;

            launchHls(currentStreamUrl);
        }

        function launchHls(rawUrl) {
            const video = document.getElementById("video-element");
            const errDiv = document.getElementById("player-error");

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // Always proxy for Akamai cross-origin AES streams
            const streamUrl = `/api/proxy?url=${encodeURIComponent(rawUrl)}`;

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr) {
                        xhr.withCredentials = false;
                    }
                });

                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            hlsInstance.startLoad();
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        } else {
                            errDiv.classList.remove("hidden");
                        }
                    }
                });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = streamUrl;
                video.addEventListener("loadedmetadata", () => video.play());
            }
        }

        function retryPlayback() {
            document.getElementById("player-error").classList.add("hidden");
            launchHls(currentStreamUrl);
        }

        function closeModal() {
            const modal = document.getElementById("player-modal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            document.body.classList.remove("modal-open");

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            const video = document.getElementById("video-element");
            video.src = "";
        }

        function checkDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (id && allMatches.length) {
                const match = allMatches.find(m => String(m.contentId).toLowerCase() === id.toLowerCase());
                if (match && match.isLive) {
                    playMatch(match);
                }
            }
        }

        // Initialize & auto-refresh every 60s
        loadData();
        setInterval(() => loadData(false), 60000);
    </script>
</body>
</html>
